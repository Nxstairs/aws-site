<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>新規登録 | AWS LENDING</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    rel="stylesheet"
    href="css/signup.css"
  >
</head>


<body>


<header class="header">

  <div class="header-inner">

    <a href="index.html" class="logo">
      AWS LENDING
    </a>

    <nav class="nav" id="nav">

      <a href="index.html#about">
        AWS LENDINGとは
      </a>

      <a href="index.html#plan">
        プラン
      </a>

      <a href="services.html">
        はじめての方へ
      </a>

      <a href="overview.html">
        企業情報
      </a>

      <a href="login.html">
        ログイン
      </a>

    </nav>

    <button
      class="menu-toggle"
      id="menuToggle"
      type="button"
    >
      ☰
    </button>

  </div>

</header>


<main>

  <section class="signup-section">

    <div class="signup-container">

      <div class="signup-heading">

        <p>
          CREATE ACCOUNT
        </p>

        <h1>
          新規登録
        </h1>

        <span>
          AWS LENDINGをご利用いただくための
          アカウントを作成します。
        </span>

      </div>


      <form class="signup-form">

        <div class="form-group">

          <label for="name">
            お名前
          </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="山田 太郎"
          >

        </div>


        <div class="form-group">

          <label for="email">
            メールアドレス
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
          >

        </div>


        <div class="form-group">

          <label for="password">
            パスワード
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="パスワードを入力"
          >

        </div>


        <div class="form-group">

          <label for="password-confirm">
            パスワード（確認）
          </label>

          <input
            type="password"
            id="password-confirm"
            name="password-confirm"
            placeholder="もう一度入力してください"
          >

        </div>


        <div class="signup-check">

          <label>

            <input type="checkbox">

            <span>
              ご利用約款に同意する
            </span>

          </label>


          <label>

            <input type="checkbox">

            <span>
              プライバシーポリシーに同意する
            </span>

          </label>

        </div>


        <button
          type="submit"
          class="signup-button"
        >
          アカウントを作成
        </button>


        <div class="login-link">

          <p>
            すでにアカウントをお持ちの方
          </p>

          <a href="login.html">
            ログインはこちら
          </a>

        </div>

      </form>

    </div>

  </section>

</main>


<script src="js/script.js"></script>

</body>

</html>
