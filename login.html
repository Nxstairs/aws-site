<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ログイン | AWS LENDING</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    rel="stylesheet"
    href="css/login.css"
  >
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="header-inner">

    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="AWS LENDING">
    </a>


    <nav class="nav" id="nav">

      <a href="services.html">
        はじめての方へ
      </a>

      <a href="user-guide.html">
        ユーザーガイド
      </a>

      <a href="overview.html">
        企業情報
      </a>

      <a href="policies.html">
        規約・ポリシー
      </a>

    </nav>


    <div class="header-actions">

      <a href="login.html" class="login-btn">
        ログイン
      </a>

      <a href="signup.html" class="start-btn">
        今すぐ始める
      </a>

    </div>


    <button class="menu-toggle"
            id="menuToggle"
            aria-label="メニューを開く">

      <span></span>
      <span></span>
      <span></span>

    </button>

  </div>

</header>

<div class="mobile-menu" id="mobileMenu">

  <div class="mobile-menu-head">

    <a href="index.html" class="mobile-menu-logo">
      <img src="images/logo.png" alt="AWS LENDING">
    </a>

    <button
      type="button"
      class="mobile-menu-close"
      id="menuClose"
      aria-label="メニューを閉じる"
    >
      ×
    </button>

  </div>


  <div class="mobile-menu-actions">

    <a href="login.html" class="mobile-login-btn">
      ログイン
      <span>›</span>
    </a>

    <a href="signup.html" class="mobile-start-btn">
      今すぐ始める
      <span>›</span>
    </a>

  </div>


  <div class="mobile-menu-grid">

    <a href="services.html">
      <img src="images/beginner.png" alt="" class="mobile-menu-icon-img">
      <strong>はじめての方へ</strong>
    </a>

    <a href="user-guide.html">
      <img src="images/guide.png" alt="" class="mobile-menu-icon-img">
      <strong>ユーザーガイド</strong>
    </a>

    <a href="overview.html">
      <img src="images/company.png" alt="" class="mobile-menu-icon-img">
      <strong>企業情報</strong>
    </a>

    <a href="policies.html">
      <img src="images/policy.png" alt="" class="mobile-menu-icon-img">
      <strong>規約・ポリシー</strong>
    </a>

  </div>

</div>

<main>

  <section class="login-section">

    <div class="login-container">


      <!-- TITLE -->

      <div class="login-heading">

        <p>
          LOGIN
        </p>

        <h1>
          ログイン
        </h1>

        <span>
          AWS LENDINGのアカウントにログインします。
        </span>

      </div>



      <!-- FORM -->

      <form class="login-form">


        <div class="form-group">

          <label for="email">
            メールアドレス
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            required
          >

        </div>



        <div class="form-group">

          <label for="password">
            パスワード
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="パスワードを入力"
            required
          >

        </div>



        <div class="forgot-password">

          <a href="#">
            パスワードをお忘れの方
          </a>

        </div>



        <button
          type="submit"
          class="login-button"
          disabled
        >
          ログイン
        </button>



        <div class="signup-link">

          <p>
            アカウントをお持ちでない方
          </p>

          <a href="signup.html">
            新規登録はこちら
          </a>

        </div>


      </form>

    </div>

  </section>

</main>

<script src="js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/login.js"></script>

</body>

</html>
