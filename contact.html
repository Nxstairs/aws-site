<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>お問い合わせ | AWS LENDING</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/contact.css">
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="header-inner">

    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="AWS LENDING">
    </a>

    <nav class="nav" id="nav">

      <a href="services.html">
        はじめての方へ
      </a>

      <a href="user-guide.html">
        ユーザーガイド
      </a>

      <a href="overview.html">
        企業情報
      </a>

      <a href="policies.html">
        規約・ポリシー
      </a>

    </nav>

    <div class="header-actions">

      <a href="login.html" class="login-btn">
        ログイン
      </a>

      <a href="signup.html" class="start-btn">
        今すぐ始める
      </a>

    </div>

    <button
      class="menu-toggle"
      id="menuToggle"
      aria-label="メニューを開く"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>

</header>


<!-- =========================
     CONTACT
========================= -->

<main>

  <section class="contact-section">

    <div class="contact-container">

      <div class="contact-heading">

        <p>
          CONTACT
        </p>

        <h1>
          お問い合わせ
        </h1>

        <span>
          AWS LENDINGに関するご質問・ご相談はこちらからお問い合わせください。
        </span>

      </div>


      <form
        class="contact-form"
        id="contactForm"
      >

        <!-- 名前 -->

        <div class="contact-form-group">

          <label for="contactName">
            お名前
          </label>

          <input
            type="text"
            id="contactName"
            name="name"
            placeholder="山田 太郎"
            required
          >

        </div>


        <!-- メール -->

        <div class="contact-form-group">

          <label for="contactEmail">
            メールアドレス
          </label>

          <input
            type="email"
            id="contactEmail"
            name="email"
            placeholder="example@example.com"
            required
          >

        </div>


        <!-- 種別 -->

        <div class="contact-form-group">

          <label for="contactType">
            お問い合わせ種別
          </label>

          <select
            id="contactType"
            name="type"
            required
          >

            <option value="">
              選択してください
            </option>

            <option value="service">
              サービスについて
            </option>

            <option value="account">
              アカウントについて
            </option>

            <option value="kyc">
              本人確認について
            </option>

            <option value="lending">
              レンディングについて
            </option>

            <option value="return">
              返還申請について
            </option>

            <option value="other">
              その他
            </option>

          </select>

        </div>


        <!-- 内容 -->

        <div class="contact-form-group">

          <label for="contactMessage">
            お問い合わせ内容
          </label>

          <textarea
            id="contactMessage"
            name="message"
            rows="8"
            placeholder="お問い合わせ内容をご入力ください。"
            required
          ></textarea>

        </div>


        <!-- 同意 -->

        <label class="contact-check">

          <input
            type="checkbox"
            id="contactAgree"
            required
          >

          <span>
            プライバシーポリシーに同意します。
          </span>

        </label>


        <!-- 送信 -->

        <button
          type="submit"
          class="contact-submit-button"
          id="contactSubmitButton"
          disabled
        >
          送信する
        </button>

      </form>

    </div>

  </section>

</main>


<script src="js/script.js"></script>
<script src="js/contact.js"></script>

</body>

</html>
